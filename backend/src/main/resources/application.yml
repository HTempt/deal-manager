server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

spring:
  application:
    name: deal-manager-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:deal_manager}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    # Required at runtime; keep credentials in the environment or an ignored local env file.
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    # Required at runtime; never use a committed fallback secret.
    secret: ${JWT_SECRET}
    expiration-days: ${JWT_EXPIRATION_DAYS:30}
  wechat:
    app-id: ${WECHAT_APP_ID:}
    app-secret: ${WECHAT_APP_SECRET:}
    follow-template-id: ${WECHAT_FOLLOW_TEMPLATE_ID:}
  notifications:
    poll-delay-ms: ${NOTIFICATION_POLL_DELAY_MS:60000}
  logging:
    slow-request-ms: ${SLOW_REQUEST_MS:3000}
  ai:
    base-url: ${AI_BASE_URL:https://api-inference.modelscope.cn/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:Qwen/Qwen3.8-27B}
    # Complete model pool is loaded from external ai-models.json.

logging:
  file:
    name: ${LOG_FILE:logs/deal-manager.log}
  level:
    root: INFO
    com.dealmanager: ${APP_LOG_LEVEL:INFO}
    # SQL parameters contain customer data; do not inherit application DEBUG here.
    com.dealmanager.mapper: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Shanghai} %-5level [%thread] [requestId=%X{requestId:-} userId=%X{userId:-}] %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Shanghai} %-5level [%thread] [requestId=%X{requestId:-} userId=%X{userId:-}] %logger{36} - %msg%n'
  logback:
    rollingpolicy:
      file-name-pattern: '${LOG_FILE:logs/deal-manager.log}.%d{yyyy-MM-dd}.%i.gz'
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: true
